<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Georgia, 'Iowan Old Style', Palatino, serif" role="img" aria-label="cubemap: map a business from boardroom to code, one zoom at a time">
  <rect width="1200" height="440" rx="20" fill="#faf8f3"/>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="19" fill="none" stroke="#e6e2d8" stroke-width="1.5"/>

  <!-- kicker -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="72" y="74" width="26" height="2" fill="#bf7d2a"/>
    <text x="108" y="80" font-size="14" letter-spacing="3" fill="#bf7d2a" font-weight="700">A CLAUDE SKILL · INFINITE ZOOM &amp; FAKES-FIRST</text>
  </g>

  <!-- title -->
  <text x="70" y="208" font-size="116" font-weight="700" fill="#2a2722" letter-spacing="-2">cubemap</text>

  <!-- tagline -->
  <text x="74" y="262" font-size="29" fill="#2a2722">Map a business from boardroom to code,</text>
  <text x="74" y="300" font-size="29" fill="#6f6d64">one zoom at a time.</text>

  <!-- footer chips -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#6f6d64">
    <rect x="74" y="346" width="150" height="30" rx="15" fill="#fff" stroke="#e6e2d8"/>
    <text x="92" y="365">business-first</text>
    <rect x="234" y="346" width="120" height="30" rx="15" fill="#fff" stroke="#e6e2d8"/>
    <text x="252" y="365">visual + story</text>
    <rect x="364" y="346" width="220" height="30" rx="15" fill="#fff" stroke="#e6e2d8"/>
    <text x="382" y="365">simulated before it's built</text>
  </g>

  <!-- zoom motif: four nested squares = the four levels -->
  <g transform="translate(810,70)">
    <rect x="0" y="0" width="300" height="300" rx="18" fill="#e2eef3" stroke="#37708f" stroke-width="1.6"/>
    <rect x="38" y="38" width="224" height="224" rx="15" fill="#f6ebd7" stroke="#bf7d2a" stroke-width="1.6"/>
    <rect x="78" y="78" width="144" height="144" rx="12" fill="#e3f0e5" stroke="#4d8759" stroke-width="1.6"/>
    <rect x="116" y="116" width="68" height="68" rx="9" fill="#ece6f4" stroke="#6a5a8c" stroke-width="1.6"/>
    <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">
      <text x="12" y="20" fill="#37708f">L1 · MACRO</text>
      <text x="48" y="56" fill="#bf7d2a">L2 · MESO</text>
      <text x="88" y="96" fill="#4d8759">L3 · MICRO</text>
      <text x="150" y="154" fill="#6a5a8c" text-anchor="middle">L4</text>
    </g>
  </g>
</svg>
