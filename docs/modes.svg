<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 280" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Two ways to use cubemap: facilitated by a consultant, or self-serve by a non-technical client manager talking to the AI until the mapping is done.">
  <rect width="1040" height="280" rx="18" fill="#faf8f3"/>
  <rect x="0.75" y="0.75" width="1038.5" height="278.5" rx="17" fill="none" stroke="#e6e2d8" stroke-width="1.5"/>

  <!-- left: facilitated -->
  <rect x="32" y="30" width="472" height="220" rx="14" fill="#fff" stroke="#e6e2d8"/>
  <text x="56" y="64" font-size="12" font-weight="700" letter-spacing="1.5" fill="#bf7d2a">FACILITATED</text>
  <text x="56" y="92" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#2a2722">A consultant runs it</text>
  <!-- scene: two people + canvas -->
  <g transform="translate(56,120)">
    <circle cx="22" cy="22" r="16" fill="#f6ebd7" stroke="#bf7d2a" stroke-width="1.4"/><circle cx="22" cy="16" r="5" fill="#bf7d2a"/><path d="M9 36 q13 -14 26 0" fill="#bf7d2a"/>
    <circle cx="70" cy="22" r="16" fill="#e2eef3" stroke="#37708f" stroke-width="1.4"/><circle cx="70" cy="16" r="5" fill="#37708f"/><path d="M57 36 q13 -14 26 0" fill="#37708f"/>
    <rect x="120" y="-2" width="280" height="48" rx="8" fill="#faf8f3" stroke="#e6e2d8"/>
    <rect x="134" y="12" width="36" height="22" rx="4" fill="#e2eef3" stroke="#37708f"/>
    <rect x="186" y="12" width="36" height="22" rx="4" fill="#f6ebd7" stroke="#bf7d2a"/>
    <rect x="238" y="12" width="36" height="22" rx="4" fill="#e3f0e5" stroke="#4d8759"/>
    <line x1="170" y1="23" x2="186" y2="23" stroke="#a6a399"/><line x1="222" y1="23" x2="238" y2="23" stroke="#a6a399"/>
    <text x="300" y="27" font-size="11" fill="#a6a399">shared canvas</text>
  </g>
  <text x="56" y="218" font-size="13" fill="#6f6d64">Uses the references as a playbook while working</text>
  <text x="56" y="236" font-size="13" fill="#6f6d64">with the client. The classic mode.</text>

  <!-- right: self-serve -->
  <rect x="536" y="30" width="472" height="220" rx="14" fill="#fff" stroke="#e6e2d8"/>
  <text x="560" y="64" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6a5a8c">SELF-SERVE</text>
  <text x="560" y="92" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#2a2722">A client manager, solo</text>
  <!-- scene: manager + AI leading -->
  <g transform="translate(560,120)">
    <circle cx="22" cy="22" r="16" fill="#e2eef3" stroke="#37708f" stroke-width="1.4"/><circle cx="22" cy="16" r="5" fill="#37708f"/><path d="M9 36 q13 -14 26 0" fill="#37708f"/>
    <path d="M46 22 l30 0 l0 -6 l12 10 l-12 10 l0 -6 l-30 0 z" fill="#a6a399"/>
    <rect x="96" y="0" width="120" height="44" rx="10" fill="#ece6f4" stroke="#6a5a8c" stroke-width="1.4"/>
    <text x="156" y="21" font-size="12" font-weight="700" fill="#6a5a8c" text-anchor="middle">the AI</text>
    <text x="156" y="36" font-size="10.5" fill="#6a5a8c" text-anchor="middle">leads the session</text>
    <text x="232" y="20" font-size="11" fill="#a6a399">asks · listens ·</text>
    <text x="232" y="35" font-size="11" fill="#a6a399">draws it back</text>
  </g>
  <text x="560" y="218" font-size="13" fill="#2a2722" font-weight="600">"Talk to the AI until your processes are mapped."</text>
  <text x="560" y="236" font-size="13" fill="#6f6d64">No jargon, no consultant in the room.</text>
</svg>
