<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The four zoom levels: Macro business map, Meso systems and contracts, Micro behaviour on live fakes, Atomic real code — linked by one contract.">
  <rect width="1040" height="660" rx="18" fill="#faf8f3"/>
  <rect x="0.75" y="0.75" width="1038.5" height="658.5" rx="17" fill="none" stroke="#e6e2d8" stroke-width="1.5"/>

  <!-- header -->
  <text x="44" y="50" font-family="Georgia, Palatino, serif" font-size="30" font-weight="700" fill="#2a2722">Four altitudes, one map</text>
  <text x="44" y="76" font-size="14.5" fill="#6f6d64">Each level takes the one above as its input. You never add detail below that contradicts the picture above.</text>

  <!-- story strip -->
  <rect x="44" y="96" width="952" height="46" rx="10" fill="#f6ebd7" stroke="#e9b865" stroke-width="1.2"/>
  <circle cx="72" cy="119" r="11" fill="#bf7d2a"/><circle cx="72" cy="115" r="3.3" fill="#fff"/><path d="M66 126 q6 -7 12 0" fill="#fff"/>
  <text x="92" y="115" font-size="13.5" font-weight="700" fill="#8a5a12">Dana's order arrived scratched. She wants her money back.</text>
  <text x="92" y="132" font-size="12.5" fill="#a06a1f">That one human moment is the reason every box below exists.</text>

  <!-- zoom rail -->
  <text x="26" y="172" font-size="10" fill="#a6a399" text-anchor="middle">ZOOM</text>
  <line x1="26" y1="184" x2="26" y2="624" stroke="#e6e2d8" stroke-width="2"/>
  <g fill="#37708f"><circle cx="26" cy="210" r="4"/><circle cx="26" cy="326" r="4"/><circle cx="26" cy="442" r="4"/><circle cx="26" cy="558" r="4"/></g>

  <!-- bands -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- L1 -->
    <rect x="48" y="160" width="850" height="104" rx="12" fill="#e2eef3" stroke="#cfe0ec" stroke-width="1.2"/>
    <rect x="48" y="160" width="70" height="104" rx="12" fill="#37708f"/>
    <text x="83" y="206" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">L1</text>
    <text x="83" y="225" fill="#cfe1f2" font-size="9.5" text-anchor="middle">MACRO</text>
    <text x="136" y="192" fill="#2a2722" font-size="16" font-weight="700">Map the business — with the client</text>
    <text x="136" y="214" fill="#6f6d64" font-size="13">Event Storming · capabilities · the rules they live by · in their own words</text>
    <text x="136" y="242" fill="#2a2722" font-size="13" font-weight="600">→ a picture they recognise + functional requirements</text>

    <!-- L2 -->
    <rect x="48" y="276" width="850" height="104" rx="12" fill="#f6ebd7" stroke="#ecd9b4" stroke-width="1.2"/>
    <rect x="48" y="276" width="70" height="104" rx="12" fill="#bf7d2a"/>
    <text x="83" y="322" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">L2</text>
    <text x="83" y="341" fill="#f6ebd7" font-size="9.5" text-anchor="middle">MESO</text>
    <text x="136" y="308" fill="#2a2722" font-size="16" font-weight="700">Systems &amp; contracts → stand up fakes</text>
    <text x="136" y="330" fill="#6f6d64" font-size="13">C4 containers · OpenAPI / AsyncAPI · live simulation on synthetic data</text>
    <text x="136" y="358" fill="#2a2722" font-size="13" font-weight="600">→ runnable before anything is built</text>

    <!-- L3 -->
    <rect x="48" y="392" width="850" height="104" rx="12" fill="#e3f0e5" stroke="#cfe6d4" stroke-width="1.2"/>
    <rect x="48" y="392" width="70" height="104" rx="12" fill="#4d8759"/>
    <text x="83" y="438" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">L3</text>
    <text x="83" y="457" fill="#e3f0e5" font-size="9.5" text-anchor="middle">MICRO</text>
    <text x="136" y="424" fill="#2a2722" font-size="16" font-weight="700">Behaviour as statecharts, on a live UI</text>
    <text x="136" y="446" fill="#6f6d64" font-size="13">XState · a policy becomes a guard — illegal states made impossible</text>
    <text x="136" y="474" fill="#2a2722" font-size="13" font-weight="600">→ stakeholders drive the real flow, still on fakes</text>

    <!-- L4 -->
    <rect x="48" y="508" width="850" height="104" rx="12" fill="#ece6f4" stroke="#ddd2ec" stroke-width="1.2"/>
    <rect x="48" y="508" width="70" height="104" rx="12" fill="#6a5a8c"/>
    <text x="83" y="554" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">L4</text>
    <text x="83" y="573" fill="#ece6f4" font-size="9.5" text-anchor="middle">ATOMIC</text>
    <text x="136" y="540" fill="#2a2722" font-size="16" font-weight="700">Real code replaces fakes — one node at a time</text>
    <text x="136" y="562" fill="#6f6d64" font-size="13">contract-tested in CI · drift can't slip through</text>
    <text x="136" y="590" fill="#2a2722" font-size="13" font-weight="600">→ every line traces back up to "Dana wants her refund"</text>
  </g>

  <!-- through-line: its own gutter to the right of the bands -->
  <g stroke="#b14d3b" fill="#b14d3b">
    <!-- the rail -->
    <path d="M946 176 L946 596" stroke-width="2.4" stroke-dasharray="2 5" stroke-linecap="round" fill="none"/>
    <!-- connector ticks into each band -->
    <line x1="898" y1="212" x2="946" y2="212" stroke-width="1.4"/>
    <line x1="898" y1="328" x2="946" y2="328" stroke-width="1.4"/>
    <line x1="898" y1="444" x2="946" y2="444" stroke-width="1.4"/>
    <line x1="898" y1="560" x2="946" y2="560" stroke-width="1.4"/>
    <circle cx="946" cy="212" r="3.4"/><circle cx="946" cy="328" r="3.4"/>
    <circle cx="946" cy="444" r="3.4"/><circle cx="946" cy="560" r="3.4"/>
  </g>
  <!-- label, set clear of the line -->
  <text x="984" y="386" fill="#b14d3b" font-size="12" font-weight="700" letter-spacing="0.8" transform="rotate(-90 984 386)" text-anchor="middle">ONE CONTRACT · the through-line</text>
</svg>
