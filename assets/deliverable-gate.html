<!--
  cubemap: the deliverable gate.

  Paste BOTH marked blocks below into every HTML deliverable. The STYLE block
  goes last inside HEAD, after the dark-mode rules, so that it wins when the
  page prints. The SCRIPT block goes last inside BODY. Copy the marker comments
  with them: a later pass finds the blocks by those markers and replaces them.
  Together the two blocks make the four deliverable invariants machine-checkable
  instead of hopeful:

    1. the PDF looks like the HTML   → the @media print block
    2. no SVG text spills its box    → audit check "svg bounds"
    3. one self-contained file       → audit check "self-contained"
    4. readable on a phone           → audit check "nothing too wide"
    5. NO EM-DASHES ANYWHERE         → audit check "no em-dashes" (hard fail)
       (+ a plain-language pass, see references/plain-language.md)

  RUN THE AUDIT, two ways, same code:
    • In a browser: open the file with #audit on the end of the URL. Do this at
      375px in the device toolbar. This is the only run that proves the phone
      layout, because headless Chrome will not size a window below ~485px.
    • Headless, for a script: covers every check except the 375px width.
        "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
          --headless=new --disable-gpu --virtual-time-budget=3000 \
          --dump-dom "file:///ABS/PATH/file.html#audit" | grep -o 'CUBEMAP-AUDIT.*'

  MAKE THE PDF (no library, no build step, Chrome is the renderer):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --no-pdf-header-footer \
      --print-to-pdf=out.pdf "file:///ABS/PATH/file.html"
-->

<!--cubemap-gate-style-->
<style>
/* --- print / PDF: the paper version must match the screen version ---
   Five things break a PDF that nobody notices on screen, and all five are
   fixed here: scroll-reveal never fires so content prints blank; the dark
   palette prints as unreadable ink; Chrome drops CSS backgrounds; vh heights
   blow one chapter up to a whole page; fixed chrome repeats on every page. */
@media print{
  @page{ margin:14mm }

  /* always print the light palette, whatever the OS theme is */
  :root{
    --bg:#fff; --surface:#fff; --card:#fff; --ink:#1e1c19; --muted:#57544d; --faint:#8a8780;
    --line:#d8d3c7;
    --amber:#a2661d; --amber-s:#f7edda; --blue:#2b6180; --blue-s:#e4eff4;
    --green:#3d7247; --green-s:#e5f1e7; --clay:#993f2d; --clay-s:#f7e5df;
    --violet:#584a79; --violet-s:#ede7f5;
  }
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact }
  html,body{ background:#fff; font-size:11.5pt }

  /* screen-only chrome */
  #bar,#rail,.scroll-hint,#cubemap-audit{ display:none !important }

  /* the IntersectionObserver never runs while printing, un-hide everything */
  .reveal{ opacity:1 !important; transform:none !important }

  /* vh heights and the flex centring are for scrolling, not for paper */
  .chap{ min-height:0; max-width:none; display:block; padding:0 0 20pt;
         break-inside:avoid; page-break-inside:avoid }
  .hero{ min-height:0 }
  main{ max-width:none; padding:0 }

  h1{ font-size:28pt } h2{ font-size:16pt } .lede{ font-size:12pt } .cap{ font-size:10pt }
  h1,h2,.kick{ break-after:avoid; page-break-after:avoid }

  figure,.entry,article,table,dl{ break-inside:avoid; page-break-inside:avoid }
  figure{ margin:12pt 0 0 }
  svg{ max-height:165mm }            /* a tall diagram must not be clipped by the page */
  a{ color:inherit; text-decoration:none }
}
</style>
<!--/cubemap-gate-style-->

<!--cubemap-gate-audit-->
<script>
/* --- cubemap deliverable audit, zero dependencies, native APIs only ---
   Silent unless you ask for it: add #audit to the URL, or call
   window.cubemapAudit() from a console or a headless driver. */
(function(){
  var SVGNS='http://www.w3.org/2000/svg';
  var MARKETING=/\b(leverage|utili[sz]e|facilitate|seamless(ly)?|robust|cutting.edge|best.in.class|game.chang\w+|unlock\w*|empower\w*|delve|in today's [\w\s]*world|it is important to note)\b/gi;

  function externals(){
    var bad=[], inert=/^\s*(data:|#|$)/i;
    [].forEach.call(document.querySelectorAll('*'),function(el){
      var tag=el.tagName.toLowerCase();
      ['src','data','href','xlink:href','poster'].forEach(function(a){
        if(tag==='a'&&a==='href') return;               // links out are fine; loads are not
        var u=el.getAttribute(a);
        if(u&&!inert.test(u)) bad.push(tag+'['+a+'] → '+u.trim().slice(0,64));
      });
    });
    [].forEach.call(document.querySelectorAll('style'),function(s){
      var m=s.textContent.match(/@import[^;]*|url\(\s*(?!["']?(data:|#))[^)]*\)/gi);
      if(m) m.forEach(function(x){ bad.push('css → '+x.trim().slice(0,64)); });
    });
    return bad;
  }

  /* bbox of an element expressed in its own <svg>'s viewBox coordinates */
  function userBox(el,svg){
    var b,m; try{ b=el.getBBox(); }catch(e){ return null; }
    var root=svg.getScreenCTM(), own=el.getScreenCTM();
    if(!root||!own) return null;                        // in <defs>, or not rendered
    m=root.inverse().multiply(own);
    var xs=[],ys=[];
    [[b.x,b.y],[b.x+b.width,b.y],[b.x,b.y+b.height],[b.x+b.width,b.y+b.height]].forEach(function(p){
      var q=svg.createSVGPoint(); q.x=p[0]; q.y=p[1]; q=q.matrixTransform(m); xs.push(q.x); ys.push(q.y);
    });
    return {x:Math.min.apply(0,xs),y:Math.min.apply(0,ys),
            X:Math.max.apply(0,xs),Y:Math.max.apply(0,ys)};
  }

  function svgBounds(){
    var bad=[], T=0.75;                                 // sub-pixel slack
    [].forEach.call(document.querySelectorAll('svg[viewBox]'),function(svg,i){
      if(svg.closest('defs,marker,symbol')) return;
      var v=svg.viewBox.baseVal, tag='svg#'+(i+1)+' ('+v.width+'×'+v.height+')';
      var rects=[];
      [].forEach.call(svg.querySelectorAll('rect,circle,ellipse,polygon'),function(el){
        if(el.closest('defs,marker,symbol')) return;
        var b=userBox(el,svg); if(b) rects.push(b);
      });
      [].forEach.call(svg.querySelectorAll('text'),function(el){
        if(el.closest('defs,marker,symbol')) return;
        var b=userBox(el,svg); if(!b) return;
        var s='"'+(el.textContent||'').trim().slice(0,42)+'"';
        // a) outside the viewBox, the label is simply cropped away
        if(b.x<v.x-T||b.y<v.y-T||b.X>v.x+v.width+T||b.Y>v.y+v.height+T)
          bad.push(tag+' · outside viewBox · '+s);
        // b) inside a shape that does not contain it, the classic overflow
        var host=null;
        rects.forEach(function(r){
          var cx=(b.x+b.X)/2, cy=(b.y+b.Y)/2;
          if(cx<r.x||cx>r.X||cy<r.y||cy>r.Y) return;    // centre not in this shape
          if(!host||(r.X-r.x)*(r.Y-r.y)<(host.X-host.x)*(host.Y-host.y)) host=r;
        });
        if(host&&(b.x<host.x-T||b.X>host.X+T||b.y<host.y-T||b.Y>host.Y+T))
          bad.push(tag+' · overflows its shape by '+
            Math.ceil(Math.max(host.x-b.x,b.X-host.X,host.y-b.y,b.Y-host.Y))+'px · '+s);
      });
    });
    return bad;
  }

  /* Em-dashes are forbidden outright. They are the single loudest signal that a
     machine wrote the text, and a deliverable that reads as machine-written
     costs the trust the whole engagement runs on. Use a comma, a colon, a
     period, or parentheses. This check never warns: it fails. */
  function emDashes(){
    var bad=[], parts=[];
    var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT), n;
    while((n=w.nextNode())){
      var p=n.parentNode&&n.parentNode.nodeName;
      if(p!=='SCRIPT'&&p!=='STYLE') parts.push(n.nodeValue);
    }
    [].forEach.call(document.querySelectorAll('[aria-label],[alt],[title]'),function(el){
      parts.push(el.getAttribute('aria-label')||'', el.getAttribute('alt')||'', el.getAttribute('title')||'');
    });
    /* U+2014 is escaped below so that this detector is itself clean */
    var re=/[^\n]{0,34}(—|\s--\s)[^\n]{0,34}/g, m, t=parts.join('\n');
    while((m=re.exec(t))&&bad.length<12) bad.push('"'+m[0].replace(/\s+/g,' ').trim()+'"');
    return bad;
  }

  function prose(){
    var warn=[], strict=[];
    [].forEach.call(document.querySelectorAll('p,li,dd,figcaption,h1,h2,h3,.lede,.cap'),function(el){
      if(el.querySelector('p,li,dd')) return;                       // leaves only
      var t=(el.textContent||'').replace(/\s+/g,' ').trim();
      if(!t) return;
      var isStrict=!!el.closest('[data-ste="strict"]');
      var limit=isStrict?20:28, sink=isStrict?strict:warn;
      t.split(/[.!?]+[\s"'”’)]+/).forEach(function(s){   // no lookbehind: older Safari
        var n=s.split(/\s+/).filter(Boolean).length;
        if(n>limit) sink.push(n+' words (max '+limit+') · "'+s.slice(0,54)+'…"');
      });
      if(isStrict){
        if(/;/.test(t)) strict.push('semicolon, use a period · "'+t.slice(0,54)+'…"');
        var c=t.match(/\b[A-Za-z]+['’](s|t|re|ve|ll|d|m)\b/g);
        if(c) strict.push('contraction '+c.slice(0,3).join(', ')+', write it out');
      }
      var m=t.match(MARKETING);
      if(m) sink.push('marketing word: '+m.slice(0,4).join(', '));
    });
    return {strict:strict,warn:warn};
  }

  /* what is too wide, named, so you know what to fix, not just that it happened */
  function tooWide(){
    var bad=[], d=document.documentElement;
    if(d.scrollWidth>d.clientWidth+1)
      bad.push('the page: '+d.scrollWidth+'px of content in a '+d.clientWidth+'px viewport');
    [].forEach.call(document.querySelectorAll('body *'),function(el){
      if(el.closest('svg')||el.id==='cubemap-audit') return;   // svg scales by viewBox
      if(getComputedStyle(el).overflowX!=='visible') return;   // a deliberate scroller
      if(el.clientWidth>0&&el.scrollWidth>el.clientWidth+1)
        bad.push('<'+el.tagName.toLowerCase()+(el.id?'#'+el.id:'')+
          (el.classList.length?'.'+[].join.call(el.classList,'.'):'')+'> '+
          el.scrollWidth+'px of content in '+el.clientWidth+'px');
    });
    return bad.slice(0,10);
  }

  function run(opts){
    var d=document.documentElement, p=prose();
    var r={
      'self-contained':externals(),
      'svg bounds':svgBounds(),
      'no em-dashes':emDashes(),
      'nothing too wide':tooWide(),
      'print stylesheet':/@media\s+print/.test(
        [].map.call(document.querySelectorAll('style'),function(s){return s.textContent}).join(''))
        ? [] : ['no @media print block, the PDF will not match the screen'],
      'plain language (strict)':p.strict,
      'plain language (prose)':p.warn
    };
    var hard=['self-contained','svg bounds','no em-dashes','nothing too wide',
              'print stylesheet','plain language (strict)'];
    r.PASS=hard.every(function(k){return !r[k].length});
    r.viewport=d.clientWidth+'px';
    if(opts!==false) render(r,hard);
    console.log('CUBEMAP-AUDIT '+JSON.stringify(r));
    return r;
  }

  function render(r,hard){
    var old=document.getElementById('cubemap-audit'); if(old) old.remove();
    var el=document.createElement('div'); el.id='cubemap-audit';
    el.style.cssText='position:fixed;left:12px;bottom:12px;max-width:min(560px,92vw);max-height:70vh;'+
      'overflow:auto;z-index:9999;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;'+
      'background:#14130f;color:#efeade;border:2px solid '+(r.PASS?'#4d8759':'#b14d3b')+';'+
      'border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.35)';
    var h='<b style="font-size:13px">'+(r.PASS?'✓ deliverable gate: PASS':'✗ deliverable gate: FAIL')+
      '</b> <span style="opacity:.55">viewport '+r.viewport+', check at 375px too</span><br>';
    Object.keys(r).forEach(function(k){
      if(k==='PASS'||k==='viewport') return;
      var v=r[k], ok=!v.length, soft=hard.indexOf(k)<0;
      h+='<div style="margin-top:7px"><span style="color:'+(ok?'#8cc79a':(soft?'#dba055':'#d77f6b'))+'">'+
        (ok?'✓':(soft?'!':'✗'))+'</span> '+k+(ok?'':' ('+v.length+')');
      v.slice(0,12).forEach(function(x){ h+='<div style="opacity:.75;margin-left:14px">'+
        String(x).replace(/[<&]/g,function(c){return c==='<'?'&lt;':'&amp;'})+'</div>'; });
      if(v.length>12) h+='<div style="opacity:.5;margin-left:14px">…and '+(v.length-12)+' more</div>';
      h+='</div>';
    });
    h+='<div style="margin-top:9px;opacity:.5">click to dismiss</div>';
    el.innerHTML=h; el.onclick=function(){el.remove()};
    document.body.appendChild(el);
  }

  window.cubemapAudit=run;
  if(location.hash==='#audit') (document.readyState==='complete')
    ? run() : window.addEventListener('load',function(){run()});
})();
</script>
<!--/cubemap-gate-audit-->
